<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Análise empresarial - FAP</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="container" id="relatorio">
<h1>Análise empresarial - FAP</h1>

<div class="card">
<h3>Empresa</h3>
<input id="cnpj" placeholder="CNPJ">
<input id="empresa" placeholder="Empresa" readonly>
<input id="cnae" placeholder="CNAE">
<input id="rat" placeholder="RAT (%)">
<input id="folha" placeholder="Folha mensal">
<input id="fapAtual" placeholder="FAP atual">
</div>

<div class="card">
<h3>Histórico INSS</h3>
<input type="number" id="b91" placeholder="B91 – Auxílio-doença acidentário">
<input type="number" id="b92" placeholder="B92 – Invalidez acidentária">
<input type="number" id="b93" placeholder="B93 – Pensão por morte">
<input type="number" id="b94" placeholder="B94 – Auxílio-acidente">
<input type="number" id="cat" placeholder="CATs vinculadas">
</div>

<div class="card">
<button onclick="calcular()">Analisar</button>
<button onclick="gerarPDF()">Gerar PDF</button>
</div>

<div class="card">
<h3>Resultado</h3>
<div id="resultado"></div>
<canvas id="grafico"></canvas>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
