<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; background:#0f172a; color:white; padding:20px; }
.container { max-width:1100px; margin:auto; }
.card { background:#1e293b; padding:20px; border-radius:10px; margin-bottom:20px; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
input, textarea { padding:10px; border-radius:6px; border:none; }
button { padding:12px; background:#22c55e; border:none; border-radius:6px; color:white; cursor:pointer; }
.resultado { margin-top:15px; }
</style>
</head>

<body>
<div class="container">

<div class="card">
<h2>🏢 Empresa</h2>
<div class="grid">
<input id="empresa" placeholder="Empresa">
<input id="cnpj" placeholder="CNPJ" onblur="buscarCNPJ()">
<input id="rat" placeholder="RAT (%)">
<input id="folha" placeholder="Folha mensal">
<input id="ano" placeholder="Ano início">
</div>
</div>

<div class="card">
<h2>📊 Histórico</h2>
<div class="grid">
<input id="b91" placeholder="B91">
<input id="cat" placeholder="CAT">
</div>
</div>

<div class="card">
<h2>📝 Anotações</h2>
<textarea id="obs" rows="4" placeholder="Digite observações..."></textarea>
</div>

<div class="card">
<button onclick="calcular()">🚀 Analisar</button>
<button onclick="gerarPDF()">📄 Gerar PDF</button>

<div class="resultado" id="resultado"></div>

<canvas id="grafico"></canvas>
</div>

</div>

<script>

// =============================
// 🔎 BUSCAR CNPJ AUTOMÁTICO
// =============================
async function buscarCNPJ(){

    let cnpj = document.getElementById("cnpj").value;

    cnpj = cnpj.replace(/\D/g,'');

    if(cnpj.length != 14){
        alert("CNPJ inválido");
        return;
    }

    document.getElementById("empresa").value = "Carregando...";

    try{
        let url = `https://brasilapi.com.br/api/cnpj/v1/${cnpj}`;

        let response = await fetch(url);
        let data = await response.json();

        if(data.razao_social){
            document.getElementById("empresa").value = data.razao_social;
        } else {
            document.getElementById("empresa").value = "";
            alert("Empresa não encontrada");
        }

    } catch(e){
        document.getElementById("empresa").value = "";
        alert("Erro ao consultar CNPJ");
    }
}

// =============================
// 📊 CÁLCULO FAP
// =============================
let dadosPDF = "";

function calcular(){

let rat = parseFloat(document.getElementById("rat").value||0);
let folha = parseFloat(document.getElementById("folha").value||0);
let ano = parseInt(document.getElementById("ano").value||0);
let b91 = parseInt(document.getElementById("b91").value||0);
let cat = parseInt(document.getElementById("cat").value||0);

let anos = new Date().getFullYear() - ano;

// 🔥 FAP
let fap = 1 + (b91*0.02) + (cat*0.01);

if(anos < 5) fap *= 0.8;

fap = Math.max(0.5, Math.min(2, fap));

let ratAjustado = rat * fap;
let custo = (ratAjustado/100)*folha;

// 📉 SIMULAÇÃO
let fapIdeal = 0.8;
let economia = ((rat - (rat*fapIdeal))/100)*folha*12;

// 🎯 RISCO
let risco = "Baixo";
if(fap>1.2) risco="Médio";
if(fap>1.5) risco="Alto";

// 🧠 SUGESTÕES
let sugestoes = "";
if(b91>5) sugestoes += "Reduzir afastamentos B91.\n";
if(cat>3) sugestoes += "Investir em segurança do trabalho.\n";
if(anos<5) sugestoes += "Empresa recente, histórico reduzido.\n";

dadosPDF = `
Empresa: ${empresa.value}
CNPJ: ${cnpj.value}

FAP: ${fap.toFixed(2)}
RAT Ajustado: ${ratAjustado.toFixed(2)}
Custo: R$ ${custo.toFixed(2)}
Economia anual: R$ ${economia.toFixed(2)}
Risco: ${risco}

Sugestões:
${sugestoes}

Observações:
${obs.value}
`;

resultado.innerHTML = dadosPDF.replace(/\n/g,"<br>");

// 📊 GRÁFICO
new Chart(document.getElementById("grafico"), {
type:"bar",
data:{
labels:["FAP Atual","FAP Ideal"],
datasets:[{
label:"Comparação",
data:[fap, fapIdeal]
}]
}
});
}

// =============================
// 📄 PDF
// =============================
function gerarPDF(){

const { jsPDF } = window.jspdf;
let doc = new jsPDF();

doc.addImage("logo.png", "PNG", 150, 10, 40, 20);

doc.setFontSize(16);
doc.text("Relatório FAP Empresarial", 20, 20);

doc.setFontSize(10);
doc.text(dadosPDF, 20, 40);

doc.save("relatorio_fap.pdf");
}

</script>

</body>
</html>
